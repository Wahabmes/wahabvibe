<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #1f2937;
      --accent: #34d399;
      --snake: #10b981;
      --food: #f97316;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1f2937 0%, #111827 50%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .card {
      width: min(95vw, 560px);
      background: color-mix(in srgb, var(--panel) 85%, black);
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 1rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .stats {
      display: flex;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stats strong {
      color: var(--text);
      margin-left: 0.25rem;
    }

    button {
      background: var(--accent);
      color: #052e16;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.05); }

    canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      image-rendering: pixelated;
    }

    .help {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 1rem;
      pointer-events: none;
      color: var(--text);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      font-weight: 700;
    }

    .game-wrap {
      position: relative;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="hud">
      <div class="stats">
        <span>Score<strong id="score">0</strong></span>
        <span>High Score<strong id="high-score">0</strong></span>
      </div>
      <button id="restart" type="button">Restart</button>
    </div>

    <div class="game-wrap">
      <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">Press any arrow key to start</div>
    </div>

    <p class="help">Use arrow keys or WASD to move. Eat food to grow. Avoid walls and yourself.</p>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlayEl = document.getElementById('overlay');
    const restartBtn = document.getElementById('restart');

    const gridSize = 20;
    const cells = canvas.width / gridSize;
    const tickMs = 120;

    let snake;
    let dir;
    let nextDir;
    let food;
    let score;
    let running;
    let gameOver;
    let highScore = Number(localStorage.getItem('snake-high-score') || 0);
    highScoreEl.textContent = highScore;

    function resetGame() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { ...dir };
      score = 0;
      running = false;
      gameOver = false;
      scoreEl.textContent = score;
      overlayEl.textContent = 'Press any arrow key to start';
      overlayEl.style.display = 'grid';
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * cells),
          y: Math.floor(Math.random() * cells)
        };
      } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
    }

    function setDirection(x, y) {
      if (x === -dir.x && y === -dir.y) return;
      nextDir = { x, y };
      if (!running && !gameOver) {
        running = true;
        overlayEl.style.display = 'none';
      }
    }

    function update() {
      if (!running || gameOver) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells) {
        endGame();
        return;
      }

      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snake-high-score', String(highScore));
          highScoreEl.textContent = highScore;
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function endGame() {
      gameOver = true;
      running = false;
      overlayEl.textContent = `Game Over — Score: ${score}. Press Restart.`;
      overlayEl.style.display = 'grid';
    }

    function drawCell(x, y, color, radius = 0) {
      const px = x * gridSize;
      const py = y * gridSize;
      ctx.fillStyle = color;
      if (radius <= 0) {
        ctx.fillRect(px + 1, py + 1, gridSize - 2, gridSize - 2);
        return;
      }
      const s = gridSize - 2;
      const r = Math.min(radius, s / 2);
      ctx.beginPath();
      ctx.moveTo(px + 1 + r, py + 1);
      ctx.arcTo(px + 1 + s, py + 1, px + 1 + s, py + 1 + s, r);
      ctx.arcTo(px + 1 + s, py + 1 + s, px + 1, py + 1 + s, r);
      ctx.arcTo(px + 1, py + 1 + s, px + 1, py + 1, r);
      ctx.arcTo(px + 1, py + 1, px + 1 + s, py + 1, r);
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.12)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= cells; i++) {
        const n = i * gridSize + 0.5;
        ctx.beginPath();
        ctx.moveTo(n, 0);
        ctx.lineTo(n, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, n);
        ctx.lineTo(canvas.width, n);
        ctx.stroke();
      }

      drawCell(food.x, food.y, '#f97316', 8);
      snake.forEach((segment, idx) => drawCell(segment.x, segment.y, idx === 0 ? '#34d399' : '#10b981', 5));
    }

    function gameLoop() {
      update();
      draw();
    }

    window.addEventListener('keydown', (event) => {
      switch (event.key.toLowerCase()) {
        case 'arrowup':
        case 'w':
          setDirection(0, -1);
          break;
        case 'arrowdown':
        case 's':
          setDirection(0, 1);
          break;
        case 'arrowleft':
        case 'a':
          setDirection(-1, 0);
          break;
        case 'arrowright':
        case 'd':
          setDirection(1, 0);
          break;
        default:
          return;
      }
      event.preventDefault();
    });

    restartBtn.addEventListener('click', resetGame);

    resetGame();
    setInterval(gameLoop, tickMs);
  </script>
</body>
</html>
